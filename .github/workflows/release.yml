name: Android Companion Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release Version Tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

  release:
    name: Build & Attach APK to GitHub Release
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Version Tag
        id: vars
        run: |
          RAW_TAG="${{ github.event.inputs.version_tag || github.ref_name }}"
          if [[ ! "$RAW_TAG" =~ ^v ]]; then
            TAG="v$RAW_TAG"
          else
            TAG="$RAW_TAG"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Package APK for Release Download
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          cp app/build/outputs/apk/debug/app-debug.apk "textpup-companion-${TAG}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: TextPup Companion ${{ steps.vars.outputs.tag }}
          files: |
            textpup-companion-${{ steps.vars.outputs.tag }}.apk
          generate_release_notes: true
